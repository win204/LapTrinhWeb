<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top left,#2563eb 0%,transparent 25%),
    radial-gradient(circle at bottom right,#7c3aed 0%,transparent 25%),
    #0f172a;
    overflow-x:hidden;
    color:white;
}

.glow{
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(120px);
    z-index:-1;
}

.glow1{
    background:#2563eb;
    top:-100px;
    left:-100px;
}

.glow2{
    background:#9333ea;
    bottom:-100px;
    right:-100px;
}

.main-container{
    padding:40px;
}

.dashboard{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(18px);
    border-radius:30px;
    padding:35px;
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.title{
    font-size:38px;
    font-weight:700;
}

.subtitle{
    color:#cbd5e1;
    margin-top:8px;
}

.status-box{
    background:linear-gradient(135deg,#22c55e,#16a34a);
    padding:12px 18px;
    border-radius:15px;
    font-weight:600;
    box-shadow:0 4px 20px rgba(34,197,94,0.4);
}

.top-cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card-box{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:22px;
    padding:22px;
    transition:0.3s;
}

.card-box:hover{
    transform:translateY(-6px);
    background:rgba(255,255,255,0.1);
}

.card-number{
    font-size:32px;
    font-weight:700;
    margin-top:10px;
}

.search-box{
    position:relative;
    margin-bottom:25px;
}

.search-box input{
    width:100%;
    padding:16px 20px;
    border:none;
    border-radius:18px;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:15px;
    outline:none;
}

.search-box input::placeholder{
    color:#cbd5e1;
}

.table-wrapper{
    overflow:hidden;
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.1);
}

table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
}

thead{
    background:rgba(255,255,255,0.08);
}

th{
    padding:18px;
    font-size:15px;
    color:#e2e8f0;
}

td{
    padding:18px;
    border-top:1px solid rgba(255,255,255,0.05);
}

tbody tr{
    transition:0.3s;
}

tbody tr:hover{
    background:rgba(255,255,255,0.06);
}

.student-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

.action-btn{
    border:none;
    padding:10px 14px;
    border-radius:12px;
    font-size:14px;
    color:white;
    margin-right:6px;
    transition:0.3s;
}

.edit-btn{
    background:linear-gradient(135deg,#f59e0b,#f97316);
}

.delete-btn{
    background:linear-gradient(135deg,#ef4444,#dc2626);
}

.action-btn:hover{
    transform:scale(1.05);
}

.form-section{
    margin-top:35px;
    background:rgba(255,255,255,0.06);
    padding:28px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.08);
}

.form-title{
    font-size:24px;
    font-weight:600;
    margin-bottom:20px;
}

.form-control{
    background:rgba(255,255,255,0.08);
    border:none;
    color:white;
    border-radius:15px;
    padding:14px;
}

.form-control:focus{
    background:rgba(255,255,255,0.12);
    color:white;
    box-shadow:none;
}

.form-control::placeholder{
    color:#cbd5e1;
}

.save-btn{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    border:none;
    padding:14px 24px;
    border-radius:15px;
    color:white;
    font-weight:600;
}

.reset-btn{
    background:rgba(255,255,255,0.08);
    border:none;
    padding:14px 24px;
    border-radius:15px;
    color:white;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#94a3b8;
}

</style>

</head>

<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="container main-container">

<div class="dashboard">

<div class="header">

<div>
<h1 class="title">🎓 Student Manager</h1>
<p class="subtitle">
Quản lý sinh viên 
</p>
</div>

<div class="status-box">
🟢 System Online
</div>

</div>

<!-- TOP CARD -->

<div class="top-cards">

<div class="card-box">
<div>👨‍🎓 Tổng Sinh Viên</div>
<div class="card-number" id="totalStudents">0</div>
</div>

<div class="card-box">
<div>📚 Đang Hoạt Động</div>
<div class="card-number">100%</div>
</div>

<div class="card-box">
<div>⚡ API Status</div>
<div class="card-number">OK</div>
</div>

</div>

<!-- SEARCH -->

<div class="search-box">
<input 
type="text"
id="search"
placeholder="🔍 Tìm kiếm sinh viên..."
onkeyup="searchStudent()"
>
</div>

<!-- TABLE -->

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>ID</th>
<th>Sinh Viên</th>
<th>Email</th>
<th>Hành Động</th>
</tr>
</thead>

<tbody id="studentTable"></tbody>

</table>

</div>

<!-- FORM -->

<div class="form-section">

<h3 class="form-title" id="formTitle">
➕ Thêm Sinh Viên
</h3>

<div class="row g-3">

<div class="col-md-6">
<input
id="name"
class="form-control"
placeholder="Nhập tên sinh viên"
>
</div>

<div class="col-md-6">
<input
id="email"
class="form-control"
placeholder="Nhập email sinh viên"
>
</div>

</div>

<div class="mt-4 d-flex gap-2">

<button
class="save-btn"
onclick="saveStudent()"
>
💾 Lưu
</button>

<button
class="reset-btn"
onclick="resetForm()"
>
♻ Làm Mới
</button>

</div>

</div>

<div class="footer">
🚀 Designed by HoPhong 
</div>

</div>

</div>

<script>

const API = "http://localhost:8080/api/students";
let editingId = null;

// LOAD
function loadStudents(){

fetch(API)
.then(res=>res.json())
.then(data=>{

document.getElementById("totalStudents").innerText =
data.length;

let html = "";

data.forEach(s=>{

html += `
<tr>

<td>${s.id}</td>

<td>

<div class="d-flex align-items-center gap-3">

<div class="student-avatar">
${s.name.charAt(0).toUpperCase()}
</div>

<div>
<div style="font-weight:600">
${s.name}
</div>

<div style="font-size:13px;color:#94a3b8">
Student
</div>
</div>

</div>

</td>

<td>${s.email}</td>

<td>

<button
class="action-btn edit-btn"
onclick="editStudent(${s.id}, '${s.name}', '${s.email}')"
>
✏ Edit
</button>

<button
class="action-btn delete-btn"
onclick="deleteStudent(${s.id})"
>
🗑 Delete
</button>

</td>

</tr>
`;

});

document.getElementById("studentTable").innerHTML =
html;

});

}

// SAVE
function saveStudent(){

const name =
document.getElementById("name").value;

const email =
document.getElementById("email").value;

if(!name || !email){
alert("Nhập đầy đủ thông tin!");
return;
}

const student = {name,email};

let url = API;
let method = "POST";

if(editingId !== null){
url = `${API}/${editingId}`;
method = "PUT";
}

fetch(url,{
method:method,
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(student)
})
.then(()=>{
resetForm();
loadStudents();
});

}

// DELETE
function deleteStudent(id){

if(!confirm("Bạn muốn xóa sinh viên này?"))
return;

fetch(`${API}/${id}`,{
method:"DELETE"
})
.then(()=>loadStudents());

}

// SEARCH
function searchStudent(){

const name =
document.getElementById("search").value.trim();

if(name===""){
loadStudents();
return;
}

fetch(`${API}/search?name=${name}`)
.then(res=>res.json())
.then(data=>{

let html = "";

data.forEach(s=>{

html += `
<tr>
<td>${s.id}</td>
<td>${s.name}</td>
<td>${s.email}</td>
<td></td>
</tr>
`;

});

document.getElementById("studentTable").innerHTML =
html;

});

}

// EDIT
function editStudent(id,name,email){

editingId = id;

document.getElementById("name").value = name;
document.getElementById("email").value = email;

document.getElementById("formTitle").innerText =
"✏ Cập Nhật Sinh Viên";

}

// RESET
function resetForm(){

editingId = null;

document.getElementById("name").value = "";
document.getElementById("email").value = "";

document.getElementById("formTitle").innerText =
"➕ Thêm Sinh Viên";

}

// INIT
loadStudents();

</script>

</body>
</html>
